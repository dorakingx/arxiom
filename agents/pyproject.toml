[project]
name = "arxiom-agents"
version = "0.1.0"
description = "AI agents for the arXiom problem-solving protocol"
requires-python = ">=3.11"
dependencies = [
    "web3>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "openai>=1.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
arxiom-master = "master_agent.agent:main"
arxiom-sub-agent = "sub_agents.base:main"
arxiom-sub-server = "sub_agents.server:main"
